# Legacy Titan Bridge: Docker Compose for local development
# Default profile: the Titan sidecar (Rust + COBOL) on port 3000 and an Anvil
# Ethereum node on port 8545 (chain ID 31337).
# The "deploy" profile adds a one-shot step that deploys Anchor.sol. It is
# opt-in, and the sidecar anchors a root only when ANCHOR_CONTRACT is set.

services:
  # ============================================================================
  # Titan Sidecar - Main Application
  # ============================================================================
  titan-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan-sidecar
    ports:
      - "3000:3000"
    environment:
      - SIDECAR_PORT=3000
      - RUST_LOG=info,titan_sidecar=debug
      - ETH_RPC_URL=http://ethereum:8545
      - ANCHOR_CONTRACT=${ANCHOR_CONTRACT:-}
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      - RISK_THRESHOLD=10000
      - COBOL_LIB_PATH=/usr/lib/titan/libcorebanking.so
    depends_on:
      ethereum:
        condition: service_healthy
    networks:
      - titan-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # Local Ethereum Node (Anvil/Foundry)
  # ============================================================================
  ethereum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: titan-ethereum
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--accounts", "10", "--balance", "1000", "--block-time", "1"]
    ports:
      - "8545:8545"
    networks:
      - titan-network
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Contract Deployer (One-shot container)
  # ============================================================================
  deploy-contracts:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: titan-deploy
    working_dir: /contracts
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      ethereum:
        condition: service_healthy
    networks:
      - titan-network
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo 'Deploying Anchor contract...' &&
        forge create Anchor.sol:Anchor --rpc-url http://ethereum:8545 --broadcast
        --out /tmp/forge-out --cache-path /tmp/forge-cache
        --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        --constructor-args 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 ||
        (echo 'Deployment did not complete. Check the forge output above. The sidecar needs ANCHOR_CONTRACT set to a deployed address.' && exit 1)
    profiles:
      - deploy

# ==============================================================================
# Networks
# ==============================================================================
networks:
  titan-network:
    driver: bridge
    name: titan-bridge-network

# ==============================================================================
# Volumes (for persistent data if needed)
# ==============================================================================
volumes:
  ethereum-data:
    driver: local
