name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Rust Checks
  # ===========================================================================
  rust:
    name: Rust ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [check, test, clippy]
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
      
      - name: Run cargo ${{ matrix.action }}
        working-directory: sidecar
        run: |
          case "${{ matrix.action }}" in
            check) cargo check --all-features ;;
            test) cargo test --all-features ;;
            clippy) cargo clippy --all-features -- -D warnings ;;
          esac

  # ===========================================================================
  # Formatting
  # ===========================================================================
  format:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        working-directory: sidecar
        run: cargo fmt --check

  # ===========================================================================
  # Solidity
  # ===========================================================================
  solidity:
    name: Solidity compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compile Anchor.sol
        run: npx -y solc@0.8.24 --bin --abi --base-path contracts -o build/contracts contracts/Anchor.sol

  # ===========================================================================
  # Docker Compose: build the image, start the default profile, check /health
  # ===========================================================================
  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the sidecar and the Anvil node
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Check /health
        run: |
          curl -sf http://localhost:3000/health | tee health.json
          echo
          grep -q '"cobol_available":true' health.json
          grep -q '"blockchain_connected":true' health.json

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
